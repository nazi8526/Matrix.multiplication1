<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrix Multiplication</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }
        body {
            font-family:
                "Vazirmatn",
                "IRANSans",
                Tahoma,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    hwb(252 71% 1% / 0.28),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 85%,
                    rgba(221, 214, 254, 0.35),
                    transparent 30%
                ),
                #F0ECF8;

            color: #332D4D;

            min-height: 100vh;
        }
        body::before {
            content:
                "∑   ∫   π   √   A⁻¹   det(A)   x²   A × B   λ   ∞   Σ   α   β   Aᵀ   rank(A)   f(x)   |A|";

            position: fixed;

            top: -100px;
            left: -100px;

            width: 220%;
            height: 220%;

            pointer-events: none;

            font-family:
                "Cambria Math",
                "Times New Roman",
                serif;

            font-size: 18px;

            line-height: 4.5;

            word-spacing: 25px;

            letter-spacing: 5px;

            color: rgba(109, 88, 160, 0.075);

            transform: rotate(-8deg);

            z-index: -1;
        }
        .container {
            width: min(1100px, 92%);

            margin: auto;

            position: relative;

            z-index: 1;
        }
        header {
            padding: 45px 0 25px;

            text-align: center;
        }
        .logo {
            min-width: 190px;

            height: 55px;

            margin: 0 auto 20px;

            padding: 0 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #8B7BC7,
                    #A99BD8
                );

            color: #FFFFFF;

            font-size: 18px;

            font-weight: 700;

            letter-spacing: 0.5px;

            box-shadow:
                0 12px 30px
                rgba(139, 123, 199, 0.20);
        }
        header h1 {
            font-size: clamp(32px, 5vw, 48px);

            margin-bottom: 10px;

            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #7565AE,
                    #8B7BC7,
                    #A99BD8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        header p {
            color: #7D7890;

            font-size: 16px;
        }

        /* =========================
           MAIN CARD
        ========================= */

        .main-card {
            background: #cad8f0;

            border: 1px solid #E3DDF0;

            border-radius: 28px;

            padding: 30px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px
                rgba(91, 76, 138, 0.10);

            margin-bottom: 40px;
        }

        /* =========================
           SECTION HEADER
        ========================= */

        .section-header {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;
        }

        .section-number {
            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background:
                rgba(139, 123, 199, 0.11);

            color: #7868B2;

            font-weight: bold;

            font-size: 18px;
        }

        .section-title h2 {
            color: #332D4D;

            font-size: 22px;
        }
        .dimensions {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;

            margin-bottom: 25px;
        }
        .dimension-card {
            background: #ede6f6;

            border: 1px solid #72017c;

            border-radius: 20px;

            padding: 22px;

            transition: 0.25s ease;
        }

        .dimension-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px
                rgba(139, 123, 199, 0.09);
        }

        .matrix-title {
            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 18px;
        }

        .matrix-title h3 {
            color: #51476F;

            font-size: 18px;
        }

        .matrix-symbol {
            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #8B7BC7,
                    #A99BD8
                );

            color: white;

            font-weight: bold;

            font-size: 18px;

            box-shadow:
                0 6px 15px
                rgba(139, 123, 199, 0.15);
        }

        /* =========================
           INPUTS
        ========================= */

        .inputs-row {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 15px;
        }

        .input-group {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .input-group label {
            color: #7D7890;

            font-size: 14px;
        }

        input,
        select {
            width: 100%;

            padding: 12px 14px;

            border-radius: 12px;

            border: 1px solid #D9D1E9;

            background: #FAF9FD;

            color: #332D4D;

            outline: none;

            font-size: 15px;

            transition: 0.2s ease;
        }

        input:focus,
        select:focus {
            border-color: #9B8BCB;

            box-shadow:
                0 0 0 3px
                rgba(139, 123, 199, 0.12);
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 25px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            cursor: pointer;

            border-radius: 13px;

            padding: 13px 22px;

            font-family: inherit;

            font-size: 15px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #8B7BC7,
                    #A99BD8
                );

            color: white;

            box-shadow:
                0 10px 25px
                rgba(139, 123, 199, 0.20);
        }

        .btn-secondary {
            background: #F0ECF9;

            border: 1px solid #D9D1E9;

            color: #554B73;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            margin-top: 20px;

            padding: 13px 16px;

            border-radius: 13px;

            font-size: 14px;
        }

        .status.success {
            background:
                rgba(139, 123, 199, 0.08);

            border:
                1px solid
                rgba(139, 123, 199, 0.20);

            color: #7565AE;
        }

        .status.error {
            background:
                rgba(220, 38, 38, 0.08);

            border:
                1px solid
                rgba(220, 38, 38, 0.20);

            color: #dc2626;
        }

        /* =========================
           OPERATIONS
        ========================= */

        .operations {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }

        .operation-card {
            background: #FBFAFD;

            border: 1px solid #E3DDF0;

            border-radius: 18px;

            padding: 20px;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .operation-card:hover {
            border-color: #9B8BCB;

            transform: translateY(-2px);
        }

        .operation-card.selected {
            border-color: #9B8BCB;

            background:
                rgba(139, 123, 199, 0.08);

            box-shadow:
                0 0 25px
                rgba(139, 123, 199, 0.08);
        }

        .operation-icon {
            font-size: 28px;

            color: #7868B2;

            margin-bottom: 10px;
        }

        .operation-card h3 {
            color: #51476F;

            margin-bottom: 7px;
        }

        .operation-card p {
            color: #7D7890;

            font-size: 14px;

            line-height: 1.8;
        }
        .matrix-editors {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 20px;

            margin-top: 25px;
        }

        .matrix-editor {
            background: #ede6f6;

            border: 1px solid #4f0bd8;

            border-radius: 20px;

            padding: 20px;

            overflow-x: auto;

            box-shadow:
                inset 0 1px 0
                rgba(255, 255, 255, 0.7);
        }

        .matrix-editor h3 {
            color: #51476F;

            margin-bottom: 15px;

            font-size: 18px;
        }

        .matrix-grid {
            display: grid;

            gap: 8px;

            justify-content: center;
        }

        .matrix-grid input {
            width: 60px;

            text-align: center;

            padding: 10px 5px;
        }
        .result-box {
            margin-top: 30px;

            padding: 25px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(94, 65, 224, 0.07),
                    rgba(152, 8, 248, 0.1)
                );

            border:
                1px solid
                rgba(139, 123, 199, 0.18);
        }

        .result-label {
            color: #7D7890;

            margin-bottom: 18px;

            font-size: 15px;
        }

        .formula {
            color: #7565AE;

            font-family:
                "Cambria Math",
                "Times New Roman",
                serif;

            font-size: 18px;

            margin-bottom: 20px;

            text-align: center;
        }

        /* =========================
           RESULT MATRIX
        ========================= */

        .result-matrix-container {
            display: flex;

            justify-content: center;

            overflow-x: auto;

            padding: 15px;
        }

        .matrix {
            position: relative;

            display: grid;

            gap: 10px;

            padding: 12px 22px;

            color: #332D4D;
        }

        .matrix::before {
            content: "";

            position: absolute;

            right: 0;

            top: 0;

            bottom: 0;

            width: 10px;

            border-right:
                3px solid #8B7BC7;

            border-top:
                3px solid #8B7BC7;

            border-bottom:
                3px solid #8B7BC7;

            border-radius: 3px;
        }

        .matrix::after {
            content: "";

            position: absolute;

            left: 0;

            top: 0;

            bottom: 0;

            width: 10px;

            border-left:
                3px solid #8B7BC7;

            border-top:
                3px solid #8B7BC7;

            border-bottom:
                3px solid #8B7BC7;

            border-radius: 3px;
        }

        .matrix-cell {
            min-width: 45px;

            text-align: center;

            font-size: 18px;

            font-weight: 600;
        }
        footer {
            text-align: center;

            color: #8b7fbd;

            font-size: 13px;

            padding: 0 0 30px;

            line-height: 1.8;
        }

        footer p:first-child {
            color: #7565AE;

            font-weight: 600;
        }

        footer p:last-child {
            color: #9A94A9;

            font-size: 12px;

            letter-spacing: 0.5px;
        }
        @media (max-width: 800px) {

            .dimensions,
            .operations,
            .matrix-editors {
                grid-template-columns: 1fr;
            }

            .main-card {
                padding: 20px;
            }
        }

        @media (max-width: 500px) {

            .inputs-row {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .matrix-grid input {
                width: 50px;
            }

            .logo {
                min-width: 170px;

                font-size: 16px;
            }
        }

    </style>
</head>

<body>
    <header>

        <div class="container">

            <div class="logo">
                Algebra Project
            </div>

            <h1>
                Matrix Multiplication
            </h1>

            <p>
                محاسبه ضرب ماتریس به صورت جبری و نقطه ای
            </p>

        </div>

    </header>
    <main class="container">

        <div class="main-card">
            <!-- STEP 1 -->

            <div class="section-header">

                <div class="section-number">
                    ۱
                </div>

                <div class="section-title">

                    <h2>
                        ابعاد ماتریس‌ها را مشخص کنید
                    </h2>

                </div>

            </div>

            <div class="dimensions">

                <!-- MATRIX A -->

                <div class="dimension-card">

                    <div class="matrix-title">

                        <div class="matrix-symbol">
                            A
                        </div>

                        <h3>
                            ماتریس A
                        </h3>

                    </div>

                    <div class="inputs-row">

                        <div class="input-group">

                            <label for="aRows">
                                تعداد سطرها
                            </label>

                            <input
                                type="number"
                                id="aRows"
                                min="1"
                                max="8"
                                value=""
                            >

                        </div>

                        <div class="input-group">

                            <label for="aCols">
                                تعداد ستون‌ها
                            </label>

                            <input
                                type="number"
                                id="aCols"
                                min="1"
                                max="8"
                                value=""
                            >

                        </div>

                    </div>

                </div>

                <!-- MATRIX B -->

                <div class="dimension-card">

                    <div class="matrix-title">

                        <div class="matrix-symbol">
                            B
                        </div>

                        <h3>
                            ماتریس B
                        </h3>

                    </div>

                    <div class="inputs-row">

                        <div class="input-group">

                            <label for="bRows">
                                تعداد سطرها
                            </label>

                            <input
                                type="number"
                                id="bRows"
                                min="1"
                                max="8"
                                value=""
                            >

                        </div>

                        <div class="input-group">

                            <label for="bCols">
                                تعداد ستون‌ها
                            </label>

                            <input
                                type="number"
                                id="bCols"
                                min="1"
                                max="8"
                                value=""
                            >

                        </div>

                    </div>

                </div>

            </div>

            <div class="buttons">

                <button
                    class="btn-primary"
                    id="continueButton"
                >
                    ادامه و ایجاد ماتریس
                </button>

                <button
                    class="btn-secondary"
                    id="resetButton"
                >
                    پاک کردن
                </button>

            </div>

            <div
                id="status"
                class="status"
                style="display:none;"
            ></div>

            <!-- STEP 2 -->

            <div
                id="operationSection"
                style="display:none; margin-top:35px;"
            >

                <div class="section-header">

                    <div class="section-number">
                        ۲
                    </div>

                    <div class="section-title">

                        <h2>
                            نوع عملیات را انتخاب کنید
                        </h2>

                    </div>

                </div>

                <div
                    id="operationsContainer"
                    class="operations"
                >

                </div>

                <!-- STEP 3 -->

                <div class="section-header">

                    <div class="section-number">
                        ۳
                    </div>

                    <div class="section-title">

                        <h2>
                            مقادیر ماتریس‌ها را وارد کنید
                        </h2>

                    </div>

                </div>

                <div class="matrix-editors">

                    <!-- MATRIX A -->

                    <div class="matrix-editor">

                        <h3>
                            ماتریس A
                        </h3>

                        <div
                            id="matrixA"
                            class="matrix-grid"
                        ></div>

                    </div>

                    <!-- MATRIX B -->

                    <div class="matrix-editor">

                        <h3>
                            ماتریس B
                        </h3>

                        <div
                            id="matrixB"
                            class="matrix-grid"
                        ></div>

                    </div>

                </div>

                <div class="buttons">

                    <button
                        class="btn-primary"
                        id="calculateButton"
                    >
                        محاسبه نتیجه
                    </button>

                </div>

                <!-- RESULT -->

                <div
                    id="resultBox"
                    class="result-box"
                    style="display:none;"
                >

                    <div class="result-label">
                        نتیجه محاسبه
                    </div>

                    <div
                        id="formula"
                        class="formula"
                    ></div>

                    <div class="result-matrix-container">

                        <div
                            id="resultMatrix"
                            class="matrix"
                        ></div>

                    </div>

                </div>

            </div>

        </div>

    </main>
    <footer>

        <div class="container">

            <p>
                Algebra Project
            </p>

            <p>
               ** NAZANIN POURHOSSEIN **
            </p>

        </div>

    </footer>

    <script>

        const aRows =
            document.getElementById("aRows");

        const aCols =
            document.getElementById("aCols");

        const bRows =
            document.getElementById("bRows");

        const bCols =
            document.getElementById("bCols");

        const continueButton =
            document.getElementById("continueButton");

        const calculateButton =
            document.getElementById("calculateButton");

        const resetButton =
            document.getElementById("resetButton");

        const operationSection =
            document.getElementById(
                "operationSection"
            );

        const operationsContainer =
            document.getElementById(
                "operationsContainer"
            );

        const matrixA =
            document.getElementById("matrixA");

        const matrixB =
            document.getElementById("matrixB");

        const resultBox =
            document.getElementById("resultBox");

        const resultMatrix =
            document.getElementById("resultMatrix");

        const formula =
            document.getElementById("formula");

        const status =
            document.getElementById("status");

        let selectedOperation =
            "algebraic";


        /* =========================
           CHECK DIMENSIONS
        ========================= */

        function checkDimensions() {

            const ar =
                Number(aRows.value);

            const ac =
                Number(aCols.value);

            const br =
                Number(bRows.value);

            const bc =
                Number(bCols.value);

            if (
                !aRows.value ||
                !aCols.value ||
                !bRows.value ||
                !bCols.value
            ) {

                return {
                    valid: false,

                    possible: false,

                    message:
                        "لطفاً تعداد سطرها و ستون‌های هر دو ماتریس را وارد کنید."
                };

            }

            if (
                ar < 1 ||
                ac < 1 ||
                br < 1 ||
                bc < 1
            ) {

                return {
                    valid: false,

                    possible: false,

                    message:
                        "ابعاد ماتریس‌ها باید حداقل ۱ باشند."
                };

            }

            if (
                ar > 8 ||
                ac > 8 ||
                br > 8 ||
                bc > 8
            ) {

                return {
                    valid: false,

                    possible: false,

                    message:
                        "حداکثر اندازه ماتریس ۸×۸ است."
                };

            }

            /*
             * شرط اصلی ضرب جبری:
             * تعداد ستون‌های A باید با تعداد سطرهای B برابر باشد.
             */

            if (ac !== br) {

                return {
                    valid: false,

                    possible: false,

                    message:
                        "ضرب امکان‌پذیر نیست؛ تعداد ستون‌های ماتریس A با تعداد سطرهای ماتریس B برابر نیست."
                };

            }

            return {
                valid: true,

                possible: true,

                message:
                    "ابعاد ماتریس‌ها صحیح است."
            };
        }


        /* =========================
           CHECK SQUARE AND SAME
        ========================= */

        function areSquareAndSame() {

            const ar =
                Number(aRows.value);

            const ac =
                Number(aCols.value);

            const br =
                Number(bRows.value);

            const bc =
                Number(bCols.value);

            return (
                ar === ac &&
                br === bc &&
                ar === br &&
                ac === bc
            );
        }


        /* =========================
           STATUS
        ========================= */

        function showStatus(
            message,
            type
        ) {

            status.textContent =
                message;

            status.className =
                "status " + type;

            status.style.display =
                "block";
        }


        /* =========================
           CREATE OPERATION CARDS
        ========================= */

        function createOperationCards() {

            operationsContainer.innerHTML =
                "";

            /*
             * گزینه اول همیشه ضرب جبری است.
             */

            const algebraicCard =
                document.createElement("div");

            algebraicCard.className =
                "operation-card selected";

            algebraicCard.dataset.operation =
                "algebraic";

            algebraicCard.innerHTML = `
                <div class="operation-icon">
                    A × B
                </div>

                <h3>
                    ضرب جبری
                </h3>

                <p>
                    ضرب استاندارد ماتریس‌ها بر اساس
                    سطرهای ماتریس اول و ستون‌های ماتریس دوم.
                </p>
            `;

            operationsContainer.appendChild(
                algebraicCard
            );


            /*
             * ضرب نقطه‌ای فقط زمانی نمایش داده می‌شود
             * که دو ماتریس مربع و کاملاً هم‌اندازه باشند.
             */

            if (areSquareAndSame()) {

                const pointwiseCard =
                    document.createElement("div");

                pointwiseCard.className =
                    "operation-card";

                pointwiseCard.dataset.operation =
                    "pointwise";

                pointwiseCard.innerHTML = `
                    <div class="operation-icon">
                        A ⊙ B
                    </div>

                    <h3>
                        ضرب نقطه‌ای
                    </h3>

                    <p>
                        هر درایه از ماتریس A در درایه متناظر
                        ماتریس B ضرب می‌شود.
                    </p>
                `;

                operationsContainer.appendChild(
                    pointwiseCard
                );
            }


            /*
             * اتصال رویداد کلیک به گزینه‌ها
             */

            document
                .querySelectorAll(
                    ".operation-card"
                )
                .forEach(card => {

                    card.addEventListener(
                        "click",
                        function () {

                            document
                                .querySelectorAll(
                                    ".operation-card"
                                )
                                .forEach(item => {

                                    item.classList.remove(
                                        "selected"
                                    );

                                });

                            this.classList.add(
                                "selected"
                            );

                            selectedOperation =
                                this.dataset.operation;

                            resultBox.style.display =
                                "none";

                        }
                    );

                });
        }


        /* =========================
           CREATE MATRIX INPUTS
        ========================= */

        function createMatrixInputs(
            container,
            rows,
            cols,
            prefix
        ) {

            container.innerHTML =
                "";

            container.style.gridTemplateColumns =
                `repeat(${cols}, 60px)`;

            for (
                let i = 0;
                i < rows;
                i++
            ) {

                for (
                    let j = 0;
                    j < cols;
                    j++
                ) {

                    const input =
                        document.createElement(
                            "input"
                        );

                    input.type =
                        "number";

                    input.value =
                        "0";

                    input.id =
                        `${prefix}-${i}-${j}`;

                    input.setAttribute(
                        "aria-label",
                        `درایه ${i + 1} و ${j + 1}`
                    );

                    container.appendChild(
                        input
                    );
                }
            }
        }


        /* =========================
           READ MATRIX
        ========================= */

        function readMatrix(
            rows,
            cols,
            prefix
        ) {

            const matrix = [];

            for (
                let i = 0;
                i < rows;
                i++
            ) {

                const row = [];

                for (
                    let j = 0;
                    j < cols;
                    j++
                ) {

                    const input =
                        document.getElementById(
                            `${prefix}-${i}-${j}`
                        );

                    row.push(
                        Number(input.value) || 0
                    );
                }

                matrix.push(row);
            }

            return matrix;
        }


        /* =========================
           MATRIX MULTIPLICATION
        ========================= */

        function multiplyMatrices(
            A,
            B
        ) {

            const rows =
                A.length;

            const cols =
                B[0].length;

            const common =
                B.length;

            const result = [];

            for (
                let i = 0;
                i < rows;
                i++
            ) {

                result[i] = [];

                for (
                    let j = 0;
                    j < cols;
                    j++
                ) {

                    let sum = 0;

                    for (
                        let k = 0;
                        k < common;
                        k++
                    ) {

                        sum +=
                            A[i][k] *
                            B[k][j];
                    }

                    result[i][j] =
                        sum;
                }
            }

            return result;
        }


        /* =========================
           POINTWISE MULTIPLICATION
        ========================= */

        function pointwiseMultiply(
            A,
            B
        ) {

            return A.map(
                (row, i) =>
                    row.map(
                        (value, j) =>
                            value * B[i][j]
                    )
            );
        }


        /* =========================
           DISPLAY MATRIX
        ========================= */

        function displayMatrix(
            matrix
        ) {

            resultMatrix.innerHTML =
                "";

            const rows =
                matrix.length;

            const cols =
                matrix[0].length;

            resultMatrix.style.gridTemplateColumns =
                `repeat(${cols}, 45px)`;

            for (
                let i = 0;
                i < rows;
                i++
            ) {

                for (
                    let j = 0;
                    j < cols;
                    j++
                ) {

                    const cell =
                        document.createElement(
                            "div"
                        );

                    cell.className =
                        "matrix-cell";

                    cell.textContent =
                        matrix[i][j];

                    resultMatrix.appendChild(
                        cell
                    );
                }
            }
        }


        /* =========================
           CONTINUE BUTTON
        ========================= */

        continueButton.addEventListener(
            "click",
            function () {

                const check =
                    checkDimensions();

                /*
                 * اگر ابعاد ناقص یا نامعتبر باشد،
                 * هیچ مرحله بعدی نمایش داده نمی‌شود.
                 */

                if (!check.valid) {

                    operationSection.style.display =
                        "none";

                    resultBox.style.display =
                        "none";

                    showStatus(
                        check.message,
                        "error"
                    );

                    return;
                }


                /*
                 * اگر ضرب امکان‌پذیر باشد،
                 * گزینه‌های عملیات ساخته می‌شوند.
                 */

                selectedOperation =
                    "algebraic";

                createOperationCards();


                showStatus(
                    check.message,
                    "success"
                );


                createMatrixInputs(
                    matrixA,
                    Number(aRows.value),
                    Number(aCols.value),
                    "A"
                );

                createMatrixInputs(
                    matrixB,
                    Number(bRows.value),
                    Number(bCols.value),
                    "B"
                );


                operationSection.style.display =
                    "block";

                resultBox.style.display =
                    "none";


                operationSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }
        );


        /* =========================
           CALCULATE
        ========================= */

        calculateButton.addEventListener(
            "click",
            function () {

                const check =
                    checkDimensions();

                if (!check.valid) {

                    showStatus(
                        check.message,
                        "error"
                    );

                    return;
                }


                const A =
                    readMatrix(
                        Number(aRows.value),
                        Number(aCols.value),
                        "A"
                    );

                const B =
                    readMatrix(
                        Number(bRows.value),
                        Number(bCols.value),
                        "B"
                    );


                let result;


                if (
                    selectedOperation ===
                    "algebraic"
                ) {

                    result =
                        multiplyMatrices(
                            A,
                            B
                        );

                    formula.textContent =
                        `حاصل ضرب ماتریس A (${aRows.value} × ${aCols.value}) در ماتریس B (${bRows.value} × ${bCols.value}) برابر است با:`;

                } else {

                    result =
                        pointwiseMultiply(
                            A,
                            B
                        );

                    formula.textContent =
                        `حاصل ضرب نقطه‌ای ماتریس A (${aRows.value} × ${aCols.value}) و ماتریس B (${bRows.value} × ${bCols.value}) برابر است با:`;
                }


                displayMatrix(
                    result
                );


                resultBox.style.display =
                    "block";


                resultBox.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            }
        );


        /* =========================
           RESET
        ========================= */

        resetButton.addEventListener(
            "click",
            function () {

                /*
                 * همه ابعاد دوباره خالی می‌شوند.
                 */

                aRows.value = "";

                aCols.value = "";

                bRows.value = "";

                bCols.value = "";


                matrixA.innerHTML =
                    "";

                matrixB.innerHTML =
                    "";

                operationsContainer.innerHTML =
                    "";


                operationSection.style.display =
                    "none";

                resultBox.style.display =
                    "none";

                status.style.display =
                    "none";


                selectedOperation =
                    "algebraic";


                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            }
        );

    </script>
